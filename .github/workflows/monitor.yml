name: Cyberpunk Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Pruefung ausfuehren
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MONITOR_CONTACT: ${{ secrets.MONITOR_CONTACT }}
        run: python monitor_once.py

      - name: Zustand zurueckschreiben, falls geaendert
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "monitor-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "Zustand aktualisiert"
            git push
          else
            echo "Kein neuer Zustand zum Speichern."
          fi
